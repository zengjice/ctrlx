<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="464" viewBox="0 0 1000 464" role="img" aria-labelledby="title desc">
  <title id="title">Your CtrlX workspace on Mac and iPhone</title>
  <desc id="desc">The Host Mac runs agents and shells in tmux. It also offers conversation forks, workflows, Orbie, and tools to inspect files, diffs, web pages and iOS apps. A local terminal can attach to the same session. An iPhone or another Mac can use the workspace through a relay that forwards end-to-end encrypted traffic. Sessions keep running when a viewer disconnects.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="0.55" stop-color="#10151C"/>
      <stop offset="1" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="hostPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181E27"/>
      <stop offset="1" stop-color="#12171E"/>
    </linearGradient>
    <linearGradient id="tmuxPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151E23"/>
      <stop offset="1" stop-color="#10161B"/>
    </linearGradient>
    <linearGradient id="relayPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17232C"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#62D8FF"/>
    </marker>
  </defs>

  <rect width="1000" height="464" rx="22" fill="url(#canvas)"/>
  <rect width="1000" height="464" rx="22" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#F2F5F8">
    <text x="32" y="46" font-size="30" font-weight="700">Your workspace on Mac and iPhone</text>

    <!-- Each Host owns its sessions and project tools. -->
    <rect x="24" y="78" width="426" height="361" rx="20" fill="#0E1218" stroke="#34404D"/>
    <rect x="29" y="73" width="426" height="361" rx="20" fill="#11161D" stroke="#3B4754"/>
    <rect x="34" y="68" width="426" height="361" rx="20" fill="url(#hostPanel)" stroke="#556271"/>
    <circle cx="62" cy="100" r="5" fill="#61E294"/>
    <text x="78" y="110" font-size="28" font-weight="700">Host Mac</text>
    <text x="440" y="107" text-anchor="end" font-size="17" fill="#A8B4BF">home or office</text>

    <rect x="52" y="128" width="390" height="136" rx="13" fill="url(#tmuxPanel)" stroke="#4C6870"/>
    <rect x="52" y="139" width="4" height="114" rx="2" fill="#61E294"/>
    <text x="70" y="159" font-size="23" font-weight="700" fill="#76E8A5">tmux sessions</text>

    <rect x="70" y="175" width="89" height="34" rx="8" fill="#13252E" stroke="#315F70"/>
    <text x="114.5" y="198" text-anchor="middle" font-size="18" font-weight="600" fill="#CDF2FF">Codex</text>
    <rect x="168" y="175" width="143" height="34" rx="8" fill="#211D2F" stroke="#54477C"/>
    <text x="239.5" y="198" text-anchor="middle" font-size="18" font-weight="600" fill="#E6DDFF">Claude Code</text>
    <rect x="320" y="175" width="104" height="34" rx="8" fill="#272318" stroke="#6D5B31"/>
    <text x="372" y="198" text-anchor="middle" font-size="18" font-weight="600" fill="#FCE7AE">Shell</text>

    <text x="70" y="231" font-size="17" fill="#DDE8EE">Sessions keep running if you disconnect.</text>
    <text x="70" y="252" font-size="15" fill="#A8B4BF">Reattach in CtrlX or Terminal.</text>

    <rect x="52" y="276" width="390" height="136" rx="13" fill="#111820" stroke="#344651"/>
    <text x="70" y="303" font-size="21" font-weight="650">Work with agents</text>
    <text x="70" y="330" font-size="18" fill="#B8C5D0">Fork · Workflows · Orbie</text>
    <path d="M70 344H424" stroke="#32424E"/>
    <text x="70" y="372" font-size="21" font-weight="650">Inspect changes</text>
    <text x="70" y="398" font-size="18" fill="#B8C5D0">Files · Git · Browser · iOS Simulator</text>

  </g>
  <g transform="translate(0 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#F2F5F8">
    <!-- The Relay forwards traffic between the paired endpoints. -->
    <g fill="none" stroke="#62D8FF" stroke-width="2.5">
      <path d="M463 221H501" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M676 221H701" marker-start="url(#arrow)"/>
      <path d="M701 149V293"/>
      <path d="M701 149H729" marker-end="url(#arrow)"/>
      <path d="M701 293H729" marker-end="url(#arrow)"/>
    </g>

    <rect x="504" y="131" width="169" height="179" rx="19" fill="url(#relayPanel)" stroke="#3B6A7B"/>
    <circle cx="588.5" cy="168" r="21" fill="#132B35" stroke="#62D8FF" filter="url(#softGlow)"/>
    <path d="M581 166V162a7.5 7.5 0 0 1 15 0v4 M578 166h21v14h-21z" fill="none" stroke="#62D8FF" stroke-width="2" stroke-linejoin="round"/>
    <text x="588.5" y="226" text-anchor="middle" font-size="28" font-weight="700">Relay</text>
    <text x="588.5" y="255" text-anchor="middle" font-size="17" fill="#B8C5D0">Forwards ciphertext</text>
    <path d="M526 269H651" stroke="#32424E"/>
    <text x="588.5" y="293" text-anchor="middle" font-size="16" fill="#88E2FF">End-to-end encrypted</text>

    <!-- The same workspace is interactive from either Viewer. -->
    <text x="734" y="78" font-size="14" font-weight="650" letter-spacing="1.3" fill="#88E2FF">PAIRED VIEWERS</text>
    <rect x="732" y="90" width="239" height="118" rx="17" fill="url(#hostPanel)" stroke="#475665"/>
    <g fill="none" stroke="#C5D2DD" stroke-width="2" stroke-linecap="round">
      <rect x="751" y="113" width="32" height="22" rx="3"/>
      <path d="M767 135v6m-7 0h14"/>
    </g>
    <text x="796" y="138" font-size="25" font-weight="700">Another Mac</text>
    <text x="752" y="179" font-size="18" fill="#B8C5D0">Open the same terminal</text>

    <rect x="732" y="234" width="239" height="118" rx="17" fill="url(#hostPanel)" stroke="#475665"/>
    <g fill="none" stroke="#C5D2DD" stroke-width="2" stroke-linecap="round">
      <rect x="758" y="252" width="19" height="32" rx="4"/>
      <path d="M765 256h5m-5 24h5"/>
    </g>
    <text x="796" y="278" font-size="25" font-weight="700">iPhone</text>
    <text x="752" y="309" font-size="18" fill="#B8C5D0">Answer an agent</text>
    <text x="752" y="332" font-size="18" fill="#B8C5D0">Try the result</text>
  </g>
</svg>
