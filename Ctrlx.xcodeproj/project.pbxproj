			name = "Copy CtrlX CLI to bundle";
			outputFileListPaths = (
			);
			outputPaths = (
				"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/CtrlXCLI",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Build the internal CtrlxCLI target and install it as CtrlXCLI\nset -e\nEDITOR_PATH=\"${BUILD_DIR}/${CONFIGURATION}/CtrlxCLI\"\nDEST=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/CtrlXCLI\"\n\nif [ -f \"$EDITOR_PATH\" ]; then\n    cp \"$EDITOR_PATH\" \"$DEST\"\n    # CtrlxEmoji is shared by the app and the CLI, so Xcode links it as a\n    # dynamic framework embedded in Contents/Frameworks. The bare copied CLI's\n    # rpaths don't cover that (Release has only /usr/lib/swift), so add it here\n    # or every CLI invocation dies in dyld before main().\n    install_name_tool -add_rpath \"@loader_path/../Frameworks\" \"$DEST\"\n    if [ \"${CODE_SIGNING_ALLOWED:-YES}\" = YES ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n        codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp \"$DEST\"\n    fi\nelse\n    echo \"warning: CtrlxCLI build product not found at $EDITOR_PATH — build the CtrlxPackage scheme first\"\nfi\n";
		};
