<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
    /* Native double-tap zoom owns the anchor; retain WebKit panning and pinching. */
    body { display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    #content { padding: 16px; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #content > svg, #content > img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    body.markdown { display: block; color: #202020; background: white; font: 16px/1.65 -apple-system, sans-serif; }
    body.markdown.dark { color: #e6e6e6; background: #1e1e1e; color-scheme: dark; }
    .markdown #content { display: block; height: auto; max-width: 880px; margin: auto; padding: 24px; overflow-wrap: anywhere; }
    .markdown h1, .markdown h2, .markdown h3 { line-height: 1.3; scroll-margin-top: 16px; }
    .markdown h1, .markdown h2 { border-bottom: 1px solid #8884; padding-bottom: .3em; }
    .markdown a { color: #1967c2; } .markdown.dark a { color: #8ab4f8; }
    .markdown pre, .markdown code { font: .9em/1.5 ui-monospace, monospace; background: #8881; border-radius: 6px; }
    .markdown code { padding: .15em .3em; } .markdown pre { padding: 14px; overflow-x: auto; }
    .markdown pre code { padding: 0; background: none; }
    .markdown table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    .markdown th, .markdown td { border: 1px solid #8885; padding: 6px 12px; }
    .markdown blockquote { margin-left: 0; padding-left: 16px; border-left: 4px solid #8885; color: #888; }
    .markdown img, .markdown svg { max-width: 100%; height: auto; }
    .markdown-image { display: block; margin: 16px 0; }
    .markdown-image img:not([src]) { display: none; }
    .markdown-error { display: block; color: #a64524; font-size: .875em; }
    .dark .markdown-error { color: #eea98e; }
    .markdown-diagram { overflow-x: auto; margin: 20px 0; }
    .markdown-diagram svg { display: block; margin: auto; }
  </style>
  <script src="mermaid.min.js"></script>
  <script src="marked.umd.js"></script>
  <script src="purify.min.js"></script>
  <script src="preview.js"></script>
  <script src="markdown.js"></script>
</head>
<body><div id="content" role="img" aria-label="Artifact preview"></div></body>
</html>
