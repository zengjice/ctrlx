ght:59px;display:flex;align-items:center;padding:0 17px;border-bottom:1px solid var(--line);gap:10px}.agent-switch{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:7px;font-weight:600;font-size:15px}.agent-switch svg.spark{color:var(--accent);width:23px;height:23px;stroke-width:1.4}.agent-switch .chevron{width:12px;color:#888}.state-pill{display:flex;align-items:center;gap:6px;color:#77726c;font-size:11px}.dot{width:5px;height:5px;background:var(--green);border-radius:50%}.state-pill.busy .dot{background:var(--accent)}.state-pill.attention .dot{background:#b67c28}.header-actions{display:flex;gap:3px;margin-left:auto;color:#817a74}.conversation{max-height:350px;overflow-y:auto;padding:22px 26px 18px;scrollbar-width:thin;scrollbar-color:#d6d0c9 transparent}.message-user{max-width:89%;margin:0 0 21px auto;padding:10px 14px;background:#f3f1ee;border-radius:12px 12px 3px 12px;white-space:pre-wrap;font-size:14px}.answer-label{display:flex;align-items:center;gap:7px;font-size:12px;color:#83766c;margin-bottom:10px}.answer-label svg{width:16px;height:16px;color:var(--accent)}.answer{padding-left:0;font-size:14px;line-height:1.85}.answer p{margin:0 0 10px}.answer ol{margin:4px 0 10px;padding-left:21px}.answer strong{font-weight:600}.file-link{padding:2px 6px;background:var(--soft);border-radius:5px;color:var(--accent);font-size:12px}.answer-actions{display:flex;gap:8px;margin-top:13px;color:#8c847b;font-size:11px}.answer-actions button{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:5px}.answer-actions svg{width:13px;height:13px}.placeholder{height:71px;display:flex;align-items:center;gap:10px;color:#938a80;font-size:13px}.activity-dots{display:inline-flex;gap:3px}.activity-dots i{width:4px;height:4px;border-radius:50%;background:#ba8065}.status-card{padding:13px 15px;border:1px solid #edddca;border-radius:9px;background:#fcf8f2;margin:4px 0 3px}.status-title{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:#7d592d}.status-title svg{width:16px;height:16px}.status-card p{font-size:12px;color:#897760;margin:4px 0 12px;line-height:1.7}.small-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.primary-small,.secondary-small{border-radius:6px;padding:5px 10px;font-size:12px}.primary-small{background:#fff;border:1px solid #ddc6ac;color:#785327}.secondary-small{color:#847360}.composer{padding:15px 22px 12px;border-top:1px solid var(--line)}.panel.empty .composer{border-top:0;padding-top:25px}.input-wrap{display:flex;gap:14px;align-items:flex-end}.composer textarea{width:100%;border:0;outline:none!important;background:none;resize:none;min-height:54px;max-height:160px;line-height:1.7;padding:0;font-size:15px}.panel.empty textarea{min-height:65px}.composer textarea::placeholder{color:#a49a90}.send{width:31px;height:31px;background:var(--accent);color:white;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:1px;flex-shrink:0}.send:hover:not(:disabled){background:#90482e}.send:disabled{background:#e9e3de;color:#a99d92;opacity:1}.composer-meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;margin-top:9px;color:#9c9389;min-height:19px}.composer-meta .model{display:flex;align-items:center;gap:6px}.composer-meta .model svg{width:12px;height:12px}.footer{height:40px;border-top:1px solid var(--line);border-radius:0 0 16px 16px;background:#fbfaf8;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:11px;color:#8d857c}.footer button{border-radius:5px;padding:3px 5px;font-size:11px;display:flex;gap:6px;align-items:center}.footer button svg{width:13px;height:13px}.footer-left{display:flex;align-items:center;gap:8px}.popup{position:absolute;z-index:4;background:#fff;box-shadow:0 12px 35px #30211724;border:1px solid #ddd6ce;border-radius:12px;padding:7px;width:300px}.agent-menu{top:51px;left:17px}.action-menu{right:15px;bottom:45px;width:260px}.popup label{display:block;padding:4px 6px 9px;border-bottom:1px solid var(--line)}.popup input{width:100%;border:0;outline:none;font-size:13px;padding:5px 3px}.menu-label{font-size:10px;color:#9a8e81;margin:10px 9px 4px}.menu-item{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:9px;border-radius:7px}.menu-item>svg{color:#9b765f;width:18px;height:18px}.menu-item div{flex:1}.menu-item small{display:block;font-size:10px;color:#9a9085}.menu-item kbd{margin-left:auto}.menu-item.selected{background:var(--soft)}.menu-divider{border-top:1px solid var(--line);margin:5px}.no-results{padding:16px 9px;color:#8c8074;font-size:12px}.design-note{max-width:680px;display:flex;justify-content:space-between;gap:24px;margin:30px auto 0;color:#8d8175;font-size:11px}.design-note p{margin:0}.reopen{margin:130px 0;background:white;border:1px solid #ddd3c8;border-radius:9px;padding:12px 22px}dialog{border:1px solid #d7cfc6;border-radius:14px;padding:25px;max-width:480px;width:calc(100% - 48px);color:var(--ink);box-shadow:0 30px 90px #382b3529}dialog::backdrop{background:#2e201e30;backdrop-filter:blur(3px)}dialog h2{font-size:18px;margin:0 0 10px}dialog p{font-size:13px;line-height:1.8;color:#777067;white-space:pre-wrap}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:24px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#302c29;color:#fff;font-size:12px;padding:10px 18px;border-radius:8px;box-shadow:0 4px 18px #30221823;z-index:9}.modal-close{background:var(--soft);color:var(--accent);padding:7px 14px;border-radius:7px}.badge{font-size:10px;color:var(--accent);margin-left:auto}.empty-hint{font-size:12px;color:#a0968a;margin-bottom:20px}.empty-hint button{padding:3px 8px;background:#f7f4f0;border-radius:5px;color:#96836f;font-size:11px;margin-right:5px}@media(max-width:700px){.design{padding:24px 16px}.intro{align-items:flex-start;flex-direction:column;gap:10px}.stage{min-height:600px}.header{padding:0 10px}.state-pill{display:none}.conversation{padding:20px}.design-note{display:block}.design-note p{margin-bottom:10px}.footer{padding:0 12px}.composer{padding:16px}.design-tag{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<main class="design">
  <div class="eyebrow">CTRLX / ORBIE</div>
  <div class="intro"><div><h1>唤醒，然后继续聊。</h1><p>一个输入入口。上下文留在身边，需要处理的事就在眼前。</p></div><span class="design-tag">交互设计原型 · 演示数据</span></div>
  <nav class="states" aria-label="演示状态"><span>试试这些状态</span>
    <button data-state="empty">初次唤醒</button><button data-state="answered">继续对话</button><button data-state="working">正在处理</button><button data-state="attention">需要处理</button><button data-state="uncertain">结果未确认</button><button data-state="restoring">恢复对话</button>
  </nav>
  <div class="stage">
    <section class="panel" aria-label="Orbie 对话浮窗">
      <header class="header">
        <button class="agent-switch" aria-haspopup="true" aria-expanded="false" title="切换 Orbie / Orbiter"><span data-icon="spark"></span><span id="agent-name">Orbie</span><span data-icon="chevron"></span></button>
        <span class="state-pill" aria-live="polite"><span class="dot"></span><span id="state-name">可以继续</span></span>
        <div class="header-actions">
          <button class="icon" data-action="terminal" aria-label="打开 Agent 标签" title="打开 Agent 标签"><span data-icon="terminal"></span></button>
          <button class="icon" data-action="full" aria-label="完整对话" title="完整对话 · ⌘J"><span data-icon="expand"></span></button>
          <button class="icon" data-action="close" aria-label="收起浮窗" title="收起 · Esc"><span data-icon="close"></span></button>
        </div>
      </header>
      <div class="conversation" id="conversation" aria-label="最近对话"></div>
      <div class="composer">
        <div class="empty-hint" hidden>从一件小事开始 <button data-prompt="帮我梳理一下今天要做的事">梳理今天的事</button><button data-prompt="帮我把一个想法整理成方案">整理一个想法</button></div>
        <div class="input-wrap"><textarea id="draft" rows="2" aria-label="给当前 Agent 的消息" placeholder="继续和 Orbie 聊聊…"></textarea><button class="send" aria-label="发送消息" title="发送 · Return" disabled><span data-icon="arrow-up"></span></button></div>
        <div class="composer-meta"><span class="model"><span data-icon="terminal"></span>Codex <span>·</span> 本机</span><span id="draft-hint">⇧ ↵ 换行</span></div>
      </div>
      <footer class="footer"><span class="footer-left"><span data-icon="spark"></span><span id="continuity">继续当前对话</span></span><button data-action="actions" aria-haspopup="true" aria-expanded="false">操作 <kbd>⌘ K</kbd></button></footer>
      <div class="popup agent-menu" hidden><label><input id="agent-search" placeholder="查找 Orbie 或 Orbiter…" aria-label="搜索 Agent"></label><div id="agent-results"></div><div class="menu-divider"></div><button class="menu-item" data-action="new"><span data-icon="plus"></span>新建 Orbiter</button><button class="menu-item" data-action="manage"><span data-icon="grid"></span>管理所有 Orbiters…</button></div>
      <div class="popup action-menu" hidden><button class="menu-item" data-action="terminal"><span data-icon="terminal"></span>打开 Agent 标签</button><button class="menu-item" data-action="full"><span data-icon="expand"></span>完整对话<kbd>⌘ J</kbd></button><div class="menu-divider"></div><button class="menu-item" data-action="new"><span data-icon="plus"></span>新建 Orbiter</button><button class="menu-item" data-action="fork" id="fork-action"><span data-icon="fork"></span>从当前对话 Fork…</button><div class="menu-divider"></div><button class="menu-item" data-action="recheck"><span data-icon="refresh"></span>重新检查状态</button><button class="menu-item" data-action="end" id="end-action" hidden><span data-icon="stop"></span>结束等待…</button></div>
    </section>
    <button class="reopen" hidden>重新唤醒 Orbie</button>
    <div class="design-note"><p>点击标题切换 Agent · 输入并按 Return 体验对话<br>⌘K 打开操作 · ⌘J 查看完整对话 · Esc 收起</p><p>原型不连接真实 Agent。<br>审批、终端及恢复操作仅演示入口。</p></div>
  </div>
</main>
<dialog aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-body"></p><div class="dialog-actions"><button class="modal-close" id="dialog-close">返回</button><button class="primary-small" id="dialog-confirm" hidden>确认</button></div></dialog>
<div class="toast" role="status" hidden></div>
<script>
const paths={spark:'<path d="M12 2c0 7-3 10-10 10 7 0 10 3 10 10 0-7 3-10 10-10C15 12 12 9 12 2Z"/><path d="m4 2 .5 2L7 5l-2.5.5L4 8l-.5-2.5L1 5l2.5-1Z"/>',chevron:'<path d="m8 10 4 4 4-4"/>',terminal:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/>',expand:'<path d="M14 3h7v7m0-7-7 7M10 21H3v-7m0 7 7-7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>','arrow-up':'<path d="M12 19V5m-6 6 6-6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M5 16H3V3h12v2"/>',fork:'<circle cx="6" cy="4" r="2"/><circle cx="18" cy="4" r="2"/><path d="M6 6v3c0 4 6 3 6 8v4m6-15v3c0 4-6 3-6 8"/>',refresh:'<path d="M20 7a9 9 0 1 0 1 8M20 2v5h-5"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4v.1"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="3"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'};
const icon=name=>`<svg aria-hidden="true" viewBox="0 0 24 24" class="${name}">${paths[name]||paths.spark}</svg>`;
function icons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)})}icons();
const $=s=>document.querySelector(s), escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const agents=[{id:'orbie',name:'Orbie',detail:'主 Agent · 继续当前对话'},{id:'callie',name:'Callie · 音频研究',detail:'~/Projects/callie · Orbiter'},{id:'docs',name:'文档整理',detail:'~/Projects/ctrlx · Orbiter'}];
const draftCache={}, stateCache={}, promptCache={};let current='orbie',state='answered',timer=null,toastTimer=null;
const statuses={empty:'随时可以开始',answered:'可以继续',working:'正在处理',attention:'需要你处理',uncertain:'结果未确认',restoring:'正在恢复'};
const samplePrompt='帮我把 Orbie 的浮窗交互重新梳理一下，先抓最重要的。';
const sampleAnswer='<p>我建议先让浮窗做好三件事：</p><ol><li><strong>唤醒就能输入</strong>，继续当前对话。</li><li><strong>回复和下一步放在一起</strong>，需要处理时直接打开终端。</li><li><strong>按需切换 Orbiter</strong>，主界面不常驻第二个搜索框。</li></ol><p>先把这条路径做顺，再加入选区和附件入口。</p>';
function showToast(text){$('.toast').textContent=text;$('.toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.toast').hidden=true,2600)}
function closeMenus(){document.querySelectorAll('.popup').forEach(el=>el.hidden=true);$('.agent-switch').setAttribute('aria-expanded','false');$('[data-action="actions"]').setAttribute('aria-expanded','false')}
function pending(){return !['empty','answered'].includes(state)}
function updateDraft(){draftCache[current]=$('#draft').value;$('.send').disabled=pending()||!$('#draft').value.trim();$('#draft').style.height='auto';$('#draft').style.height=Math.min(160,$('#draft').scrollHeight)+'px'}
function render(next=state){state=next;stateCache[current]=next;closeMenus();$('.panel').classList.toggle('empty',state==='empty');$('#state-name').textContent=statuses[state];$('.state-pill').className='state-pill '+(['attention','uncertain'].includes(state)?'attention':pending()?'busy':'');$('#agent-name').textContent=agents.find(a=>a.id===current).name;$('#continuity').textContent=current==='orbie'?'继续当前对话':'Orbiter · 独立对话';$('#draft').placeholder=pending()?'可以先写下想法，稍后手动发送…':`继续和 ${agents.find(a=>a.id===current).name} 聊聊…`;$('#draft-hint').textContent=pending()?'草稿保留，不会自动发送':'⇧ ↵ 换行';$('.empty-hint').hidden=state!=='empty';$('#fork-action').disabled=pending();$('#end-action').hidden=!['uncertain','attention','working'].includes(state);document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));
let body='';if(state!=='empty')body=`<div class="message-user">${escapeHTML(promptCache[current]||samplePrompt)}</div>`;
if(state==='answered')body+=`<div class="answer-label">${icon('spark')} ${escapeHTML(agents.find(a=>a.id===current).name)}</div><div class="answer">${sampleAnswer}</div><div class="answer-actions"><button data-action="copy">${icon('copy')}复制回复</button><button data-action="fork">${icon('fork')}交给 Orbiter…</button></div>`;
if(state==='working')body+='<div class="placeholder"><span class="activity-dots"><i></i><i></i><i></i></span>正在处理你的消息…</div>';
if(state==='attention')body+=`<div class="status-card"><div class="status-title">${icon('alert')}需要你处理一下</div><p>Agent 正在等待你的输入，请在终端中查看并继续。</p><div class="small-actions"><button class="primary-small" data-action="terminal">打开 Agent 标签 ↗</button></div></div>`;
if(state==='uncertain')body+=`<div class="status-card"><div class="status-title">${icon('alert')}这条消息的结果尚未确认</div><p>请先查看终端，避免重复发送。</p><div class="small-actions"><button class="primary-small" data-action="terminal">查看终端 ↗</button><button class="secondary-small" data-action="recheck">重新检查</button></div></div>`;
if(state==='restoring')body+=`<div class="placeholder"><span class="activity-dots"><i></i><i></i><i></i></span>正在恢复原对话，完成后会自动连接。</div><div class="small-actions"><button class="secondary-small" data-action="terminal">查看恢复标签 ↗</button></div>`;
$('#conversation').innerHTML=body;$('#conversation').hidden=state==='empty';$('#draft').value=draftCache[current]||'';updateDraft()}
function renderAgents(){const query=$('#agent-search').value.trim().toLowerCase();const matches=agents.filter(a=>(a.name+' '+a.detail).toLowerCase().includes(query));$('#agent-results').innerHTML='<div class="menu-label">当前 Mac</div>'+matches.map(a=>`<button class="menu-item ${a.id===current?'selected':''}" data-agent="${a.id}">${icon(a.id==='orbie'?'spark':'fork')}<div>${a.name}<small>${a.detail}</small></div>${a.id===current?'<span class="badge">当前</span>':''}</button>`).join('')+(matches.length?'':'<div class="no-results">没有匹配的 Agent</div>')}
function modal(title,body,confirm){closeMenus();$('#dialog-title').textContent=title;$('#dialog-body').textContent=body;$('#dialog-confirm').hidden=!confirm;$('#dialog-confirm').onclick=()=>{$('dialog').close();confirm?.()};$('dialog').showModal()}
const actions={terminal:()=>modal('打开 Agent 标签','正式版本会直接定位到当前 Agent 的终端，供你查看进度、回答问题或处理审批。\n\n这是交互原型，没有向终端发送输入。'),full:()=>modal('完整对话','正式版本复用现有完整对话窗口，展示同一 Agent 的记录及附件；可加载更早记录。\n\n浮窗草稿保留，不新建 Agent 或 Workflow。'),new:()=>modal('新建 Orbiter','正式版本打开现有 New Agent 表单，自行选择 Provider 和目录。\n\n创建独立 Agent；当前草稿不自动发送。'),fork:()=>modal('从当前对话 Fork','正式版本打开现有 Fork 表单，继承当前已验证的原生对话。\n\n创建后由你确认并发送独立任务，不创建 Workflow。'),manage:()=>modal('管理 Orbiters','正式版本打开现有 Orbiters 窗口，保留新建、关联、原对话恢复和 Workflow 入口。'),close:()=>{closeMenus();$('.panel').hidden=true;$('.reopen').hidden=false},actions:()=>{const open=$('.action-menu').hidden;closeMenus();$('.action-menu').hidden=!open;$('[data-action="actions"]').setAttribute('aria-expanded',String(open));if(open)$('.action-menu button').focus()},recheck:()=>{closeMenus();showToast('演示：重新检查状态，不重复发送消息。')},end:()=>modal('结束等待？','仅结束这条消息的结果等待，不会停止 Agent，也不会撤回已发送的内容。\n\n继续发送前仍需确认终端空闲。',()=>{render('working');showToast('演示：已结束等待；Agent 仍在工作时继续保留草稿。')}),copy:async()=>{try{await navigator.clipboard.writeText($('.answer').innerText);showToast('已复制演示回复')}catch{showToast('请选中回复文字，使用 ⌘C 复制')}}};
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.state){clearTimeout(timer);$('.panel').hidden=false;$('.reopen').hidden=true;render(button.dataset.state);return}if(button.dataset.agent){draftCache[current]=$('#draft').value;current=button.dataset.agent;render(stateCache[current]||'empty');$('#draft').focus();return}if(button.dataset.prompt){$('#draft').value=button.dataset.prompt;updateDraft();$('#draft').focus();return}if(button.dataset.action)actions[button.dataset.action]?.()});
$('.agent-switch').onclick=()=>{const open=$('.agent-menu').hidden;closeMenus();if(open){$('.agent-menu').hidden=false;$('.agent-switch').setAttribute('aria-expanded','true');$('#agent-search').value='';renderAgents();$('#agent-search').focus()}};
$('#agent-search').oninput=renderAgents;
$('#draft').oninput=updateDraft;
function send(){if(pending()||!$('#draft').value.trim())return;promptCache[current]=$('#draft').value;draftCache[current]='';render('working');const sentTo=current;timer=setTimeout(()=>{stateCache[sentTo]='answered';if(current===sentTo&&state==='working')render('answered')},1800)}
$('.send').onclick=send;
$('#draft').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send()}};
document.addEventListener('keydown',event=>{if(event.isComposing)return;if($('dialog').open)return;if(event.key==='Escape'){event.preventDefault();if(!$('.agent-menu').hidden||!$('.action-menu').hidden){closeMenus();$('#draft').focus()}else actions.close()}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();actions.actions()}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='j'){event.preventDefault();actions.full()}});
document.addEventListener('click',event=>{if(!event.target.closest('.popup,.agent-switch,[data-action="actions"]'))closeMenus()});
$('#dialog-close').onclick=()=>$('dialog').close();$('.reopen').onclick=()=>{$('.panel').hidden=false;$('.reopen').hidden=true;render();$('#draft').focus()};
render('answered');
</script>
</html>
